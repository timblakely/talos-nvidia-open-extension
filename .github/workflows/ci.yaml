# CI for talos-nvidia-open-extension.
#
# Behavior by event:
#
#   pull_request       Run the shell tests, then build the kernel, the
#                      kernel-modules pkg and the zfs pkg without pushing.
#                      The "extensions" and later jobs are skipped on PRs:
#                      they must PULL the images built in phase 1, and PR
#                      builds don't push them. This means extension
#                      repackaging is only exercised on push/tag/dispatch
#                      events — a known, accepted limitation chosen over
#                      running a local registry service container.
#
#   push (main / tag)  Build + push kernel, nvidia-open-latest-pkg and
#   workflow_dispatch  zfs-pkg, then the extensions.
#
# Tag trigger: release tags follow <driver-version>-<talos-version>
# (e.g. 595.71.05-v1.13.5), which has no common "v*" prefix, so we trigger on
# all tags rather than a glob pattern.

name: ci

on:
  workflow_dispatch:
    inputs:
      # Branch or tag to build from (defaults to the branch you dispatch
      # from). Lets a PR branch exercise the push-only jobs (imager,
      # sidero-extensions, catalog) without merging.
      ref:
        description: Branch or tag to build
        required: false
        default: ""
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pushing to GHCR uses the built-in GITHUB_TOKEN (packages inherit repo
# visibility; make the private fork's packages public so Talos nodes can
# pull them anonymously). Registry/namespace overridable via secrets for
# forks that prefer Docker Hub: set GHCR_NAMESPACE to e.g. docker.io/user.
env:
  REGISTRY: ${{ secrets.REGISTRY || 'ghcr.io' }}
  USERNAME: ${{ secrets.GHCR_NAMESPACE || github.actor }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: make test

  # Phase 1: NVIDIA open kernel modules compiled against the Talos kernel
  # inside the pinned siderolabs/pkgs checkout. Full kernel compile on a cold
  # cache: 60+ minutes, hence the generous timeout. amd64 only: the cluster
  # has no arm machines and a kernel build under QEMU emulation is
  # impractically slow.
  kernel-pkgs:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free runner disk (kernel + NVIDIA + zfs builds need ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      # The release key signs the kernel and every module; without it the
      # build still compiles (throwaway key) but nothing may be pushed.
      - name: Install the module signing key
        if: github.event_name != 'pull_request'
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          if [ -z "${MODULE_SIGNING_KEY}" ]; then
            echo "::error::MODULE_SIGNING_KEY repository secret is not set (PEM with private key and certificate, see README 'Kernel and module signing')."
            exit 1
          fi
          mkdir -p "${HOME}/.cache/talos-nvidia-open-extension"
          (umask 077; printf '%s\n' "${MODULE_SIGNING_KEY}" > "${HOME}/.cache/talos-nvidia-open-extension/module-signing-key.pem")
          hack/module-signing-key.sh matches "${HOME}/.cache/talos-nvidia-open-extension/module-signing-key.pem" certs/module-signing.crt \
            || { echo "::error::MODULE_SIGNING_KEY does not match certs/module-signing.crt"; exit 1; }

      - name: Determine version
        id: version
        run: |
          driver="$(awk '/^NVIDIA_DRIVER_VERSION:/ {print $2}' vars.yaml)"
          talos="$(awk '/^TALOS_VERSION \?=/ {print $3}' Makefile)"
          echo "version=${driver}-${talos}" >> "$GITHUB_OUTPUT"

      # KERNEL_SRC_FALLBACK defaults to 0 (cdn.kernel.org functional again
      # as of 2026-09-06), so CI uses the canonical kernel.org tarball with the
      # checksums pinned in the siderolabs/pkgs Pkgfile. The git.kernel.org
      # snapshot fallback (=1) remains available for networks where kernel.org
      # tarball downloads are blocked.
      - name: Build kernel, NVIDIA modules pkg and zfs pkg (push on non-PR events)
        run: |
          make kernel nvidia-open-latest-pkg zfs-pkg \
            REGISTRY="${REGISTRY}" \
            USERNAME="${USERNAME}" \
            PLATFORM=linux/amd64 \
            PUSH=${{ github.event_name != 'pull_request' }}

  # Phase 2: extension images. Repackaging only (no compilation); one
  # single-platform build produces the amd64 extension images.
  extensions:
    if: github.event_name != 'pull_request'
    needs: kernel-pkgs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          driver="$(awk '/^NVIDIA_DRIVER_VERSION:/ {print $2}' vars.yaml)"
          talos="$(awk '/^TALOS_VERSION \?=/ {print $3}' Makefile)"
          echo "version=${driver}-${talos}" >> "$GITHUB_OUTPUT"

      - name: Build and push extension images
        run: |
          make nvidia-open-modules nvidia-open-firmware nvidia-open-toolkit \
            REGISTRY="${REGISTRY}" \
            USERNAME="${USERNAME}" \
            PLATFORM=linux/amd64 \
            PUSH=true

  # Phase 3a: Talos imager whose kernel is ours. The factory lists Talos
  # versions from this repository's tags, so the tag must be exactly the Talos
  # version.
  imager:
    if: github.event_name != 'pull_request'
    needs: kernel-pkgs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push imager
        run: make imager REGISTRY="${REGISTRY}" USERNAME="${USERNAME}" PUSH=true

  # Phase 3b: upstream kernel-module extensions rebuilt against our kernel.
  sidero-extensions:
    if: github.event_name != 'pull_request'
    needs: kernel-pkgs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror linux-firmware and rebuild extensions
        run: make linux-firmware-mirror sidero-extensions REGISTRY="${REGISTRY}" USERNAME="${USERNAME}" PUSH=true
